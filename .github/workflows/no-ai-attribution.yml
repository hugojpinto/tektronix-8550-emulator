# Project rule: no AI attribution, in any form, in commit messages (see CLAUDE.md, Conventions).
name: no-ai-attribution
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit messages
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ]; then range="$BASE..$HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then range="$BEFORE..$HEAD"
          else range="$HEAD"; fi
          status=0
          for c in $(git rev-list "$range"); do
            git log -1 --format=%B "$c" > msg.txt
            if ! sh .githooks/check-ai-attribution.sh msg.txt; then echo "  in commit $c"; status=1; fi
          done
          exit $status
